[package]
name = "iod"
version = "0.1.3"
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "iod"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27.2", features = ["extension-module", "indexmap", "abi3-py39"] }
walkdir = "2.5.0"
indexmap = "2.2.6"
